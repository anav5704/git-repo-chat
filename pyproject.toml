[project]
name = "repo-chat"
version = "0.1.0"
description = "Chat with a git repository"
requires-python = ">=3.13"
dependencies = [
    "db",
    "jobs",
    "repogit",
    "chunking",
    "embeddings",
    "llm",
    "retrieval",
    "web",
    "indexer",
    "api",
    "tui",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
db = { workspace = true }
jobs = { workspace = true }
repogit = { workspace = true }
chunking = { workspace = true }
embeddings = { workspace = true }
llm = { workspace = true }
retrieval = { workspace = true }
web = { workspace = true }
indexer = { workspace = true }
api = { workspace = true }
tui = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyright>=1.1.390",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py313"
src = ["packages", "apps"]

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "chunking",
    "db",
    "embeddings",
    "indexer",
    "jobs",
    "llm",
    "repogit",
    "retrieval",
    "tui",
    "web",
]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["packages", "apps"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
