name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: repo_chat
          POSTGRES_PASSWORD: repo_chat
          POSTGRES_DB: repo_chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repo_chat -d repo_chat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://repo_chat:repo_chat@localhost:5432/repo_chat
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
