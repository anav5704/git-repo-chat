[project]
name = "indexer"
version = "0.1.0"
description = "Claim index jobs and store chunks for a repo"
requires-python = ">=3.13"
dependencies = [
    "chunking",
    "db",
    "embeddings",
    "queue",
    "repogit",
    "structlog>=24.4",
]

[tool.uv.sources]
chunking = { workspace = true }
db = { workspace = true }
embeddings = { workspace = true }
queue = { workspace = true }
repogit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
