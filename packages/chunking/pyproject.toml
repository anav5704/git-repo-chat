[project]
name = "chunking"
version = "0.1.0"
description = "Split source files, commits, and documents into chunks"
requires-python = ">=3.13"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
