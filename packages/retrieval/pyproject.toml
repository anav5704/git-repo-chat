[project]
name = "retrieval"
version = "0.1.0"
description = "Search stages, fusion, rerank, and context packing for one repo"
requires-python = ">=3.13"
dependencies = [
    "db",
    "embeddings",
    "llm",
    "pydantic>=2.10",
]

[tool.uv.sources]
db = { workspace = true }
embeddings = { workspace = true }
llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
