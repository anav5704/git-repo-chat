[project]
name = "web"
version = "0.1.0"
description = "Web search, fetch, extract, and cache"
requires-python = ">=3.13"
dependencies = [
    "chunking",
    "db",
    "embeddings",
    "httpx>=0.27",
    "pgvector>=0.3",
    "psycopg>=3.2",
    "trafilatura>=2.0",
]

[tool.uv.sources]
chunking = { workspace = true }
db = { workspace = true }
embeddings = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
